<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3-week_HW_AITK</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="main col-12">
        <div class="buttonsAgeInput col-4">
            <div>
                <h3 class="text1">Проверка возраста</h3>
                <input type="number" id="ageInput" placeholder="Write your age">
                <button id="checkBtn">check</button>
                <p id="result"></p>
            </div>
        </div>
        <div class="buttonsMarks col-4">
            <div>
                <h3 class="text2">Проверка балла</h3>
                <input type="number" id="markInput" placeholder="Write you score 20/?">
                <button id="checkBtnMarks">check</button>
                <p id="resultMarks"></p>
            </div>
        </div>
     <script src="script.js"></script>   
    </div>
</body>

</html>
